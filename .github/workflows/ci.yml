name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the deploy workflows are the only place that needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy / no unpinned actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Every `uses:` must be pinned to a commit SHA
        run: python scripts/ci/check_workflows.py .

  site:
    name: site / static audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Encoding, missing assets, dead anchors, weight budget
        run: python scripts/ci/check_site.py . --max-kb 300

  build:
    name: build / node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build the app bundle
        run: npm run build:app

      - name: Generate and validate the prompt library
        run: npm run validate:prompts

      # `validate:prompts` regenerates the prompt library on purpose, so a dirty
      # tree here is expected. Surface the drift as a warning instead of failing.
      - name: Report generated files that drifted
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::build rewrote tracked files - commit them if this was intended"
            git status --short
          fi

      - name: Upload dist artifact
        if: matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist
          retention-days: 7
